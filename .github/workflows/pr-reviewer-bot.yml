name: AI Subagent PR Reviewer Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-subagent-review:
    name: Subagent Code Review & Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Subagent Bot Verification Suite
        run: |
          python -m pytest tests/test_explore_agent.py tests/test_review_subagents.py tests/test_context_manager.py tests/test_autofix_triage.py tests/test_benchmark_runner.py -v

      - name: Execute Subagent PR Review Pipeline & Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "
          import os, json, urllib.request
          from bot.orchestrator import PRReviewOrchestrator
          from benchmark.seeded_pr_diff import get_seeded_benchmark_pr

          orchestrator = PRReviewOrchestrator()
          pr = get_seeded_benchmark_pr()
          result = orchestrator.run_review(pr)
          comment_md = orchestrator.generate_markdown_comment(result)

          with open('review_comment.md', 'w', encoding='utf-8') as f:
              f.write(comment_md)

          token = os.environ.get('GITHUB_TOKEN')
          pr_num = os.environ.get('PR_NUMBER')
          repo = os.environ.get('GITHUB_REPOSITORY')

          print(f'Posting PR review to repo={repo}, PR={pr_num}')
          if token and pr_num and repo:
              # 1. Post or Update Comment
              url = f'https://api.github.com/repos/{repo}/issues/{pr_num}/comments'
              req = urllib.request.Request(
                  url,
                  data=json.dumps({'body': comment_md}).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'PR-Reviewer-Bot'
                  }
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print('Successfully posted review comment, HTTP', resp.status)
              except Exception as e:
                  print('Warning: Failed to post comment:', e)

              # 2. Add Labels
              if result.triage_labels:
                  label_url = f'https://api.github.com/repos/{repo}/issues/{pr_num}/labels'
                  label_req = urllib.request.Request(
                      label_url,
                      data=json.dumps({'labels': result.triage_labels}).encode('utf-8'),
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Accept': 'application/vnd.github+json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'PR-Reviewer-Bot'
                      }
                  )
                  try:
                      with urllib.request.urlopen(label_req) as resp:
                          print('Successfully applied triage labels, HTTP', resp.status)
                  except Exception as e:
                      print('Warning: Failed to apply labels:', e)
          "
